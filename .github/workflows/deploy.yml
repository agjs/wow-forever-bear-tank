name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install LuaJIT (addon tests)
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit and addon tests
        run: pnpm verify
      - name: Build addon release and website
        run: pnpm build
      - uses: actions/configure-pages@v6.0.0
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
